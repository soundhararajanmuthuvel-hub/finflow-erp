<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — FinFlow Private Finance</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#072661" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #1A1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 2px solid #E7E5E4;
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }
    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #8B1A1A 0%, #EA580C 100%);
    }
    .logo-container {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #072661;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 2px solid rgba(139, 26, 26, 0.2);
    }
    .logo-container img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .icon-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1A1A1A;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #57534E;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: #8B1A1A;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
    }
    .retry-btn:hover {
      background: #721414;
    }
    .retry-btn:active {
      transform: scale(0.99);
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #A8A29E;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent-bar"></div>
    <div class="logo-container">
      <img src="/brand/finflow-mark.svg" alt="FinFlow" />
    </div>

    <div class="icon-badge">
      <span>●</span> Offline Mode
    </div>

    <h1>No Internet Connection</h1>
    <p>
      You are currently offline. FinFlow requires an active internet connection to safely process transactions, record repayments, and protect financial audit records.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>

  <div class="footer">
    FinFlow — Private Finance Management • Product by MSR Solutions
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
